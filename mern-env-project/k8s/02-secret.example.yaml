# Template only — DO NOT put real production credentials in this file.
# Create real secrets directly in-cluster via kubectl or scripts/deploy-gke.sh:
#
#   kubectl -n mern-prod create secret generic mongo-secret \
#     --from-literal=MONGO_INITDB_ROOT_USERNAME=mernadmin \
#     --from-literal=MONGO_INITDB_ROOT_PASSWORD="$(openssl rand -hex 24)" \
#     --from-literal=MONGO_INITDB_DATABASE=mern_db
#
#   kubectl -n mern-prod create secret generic mern-app-secret \
#     --from-literal=MONGO_URI="mongodb://mernadmin:<MONGO_PASSWORD>@mongo-0.mongo-headless.mern-prod.svc.cluster.local:27017/mern_db?authSource=admin" \
#     --from-literal=JWT_SECRET="$(openssl rand -base64 32)" \
#     --from-literal=API_KEY="$(openssl rand -hex 24)"
apiVersion: v1
kind: Secret
metadata:
  name: mongo-secret
  namespace: mern-prod
type: Opaque
stringData:
  MONGO_INITDB_ROOT_USERNAME: "mernadmin"
  MONGO_INITDB_ROOT_PASSWORD: "REPLACE_WITH_STRONG_PASSWORD"
  MONGO_INITDB_DATABASE: "mern_db"
---
apiVersion: v1
kind: Secret
metadata:
  name: mern-app-secret
  namespace: mern-prod
type: Opaque
stringData:
  MONGO_URI: "mongodb://mernadmin:REPLACE_WITH_STRONG_PASSWORD@mongo-0.mongo-headless.mern-prod.svc.cluster.local:27017/mern_db?authSource=admin"
  JWT_SECRET: "REPLACE_WITH_256_BIT_SECRET"
  API_KEY: "REPLACE_WITH_API_KEY"
